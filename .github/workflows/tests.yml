name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (isolated HOME and global git config)
        run: python tests/test_core.py
      - name: GUI and CLI import check
        run: python -c "import gitaccounts.gui, gitaccounts.cli; print('ok')"
